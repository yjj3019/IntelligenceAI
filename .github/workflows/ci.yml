name: controller-ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  fixture-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed uv
        run: python -m pip install uv==0.11.11
      - name: Install locked repo-local dependencies
        run: uv sync --frozen --extra dev
      - name: Record actual platform and architecture
        run: uv run --frozen python scripts/ci_platform.py --expected ${{ matrix.arch }}
      - name: Retrieve checksum-verified optional POSIX scanner
        if: runner.os != 'Windows'
        run: |
          python scripts/fetch_gitleaks.py
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Scan exact tracked release blobs
        if: runner.os != 'Windows'
        run: uv run --frozen python scripts/scan_release.py
      - name: Format
        run: uv run --frozen ruff format --check src tests scripts
      - name: Fixture, contract, recovery and process tests
        run: uv run --frozen pytest -q -rs --durations=10 --junitxml=test-results.xml
      - name: Repeat owned concurrency simulations with recorded seeds
        run: uv run --frozen python scripts/simulate_races.py
      - name: Build package
        run: uv build --no-sources --no-build-isolation
      - name: Install built wheel and smoke entry points
        run: uv run --frozen python scripts/package_smoke.py

  linux-isolation-probe:
    # Ephemeral CI only. No AppArmor/sysctl changes, privileged container or vendor network.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.11.11
      - run: uv sync --frozen --extra dev --extra web
      - name: Official Ubuntu CI-only pinned backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap=0.6.1-1ubuntu0.3
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = '0.6.1-1ubuntu0.3'
          bwrap --version
          sha256sum /usr/bin/bwrap
          gcc --version
      - name: Actual networkless malicious namespace probes
        run: uv run --frozen pytest tests/test_isolation.py -k actual_linux -q -rs --junitxml=isolation-tests.xml
      - name: Actual unpaid namespace, CLI-shaped fixture and broker relay
        run: uv run --frozen --extra dev --extra web pytest tests/test_claude_linux.py -q -rs --junitxml=claude-relay-tests.xml
      - name: Separate BLOCKED, FAILED and offline probe evidence
        if: always()
        run: |
          if test -f isolation-tests.xml; then
            python scripts/isolation_ci_report.py isolation-tests.xml
          else
            echo 'BLOCKED: backend preparation or test launch unavailable. OS isolation UNVERIFIED; live provider NOTRUN.' >> "$GITHUB_STEP_SUMMARY"
          fi

  web-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-local-only
          POSTGRES_DB: intelligenceai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d intelligenceai_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - run: python -m pip install uv==0.11.11
      - run: uv sync --frozen --extra dev --extra web
      - name: SQLite service and signed offline OIDC contracts
        run: uv run --frozen --extra dev --extra web pytest tests/test_web.py tests/test_web_runner.py tests/test_live_authority.py tests/test_approved_vendor.py tests/test_claude_transport.py -q -rs
      - name: Real ephemeral PostgreSQL service contracts
        env:
          IAI_TEST_DATABASE_URL: postgresql+psycopg://fixture:fixture-local-only@127.0.0.1:5432/intelligenceai_test
        run: uv run --frozen --extra dev --extra web pytest tests/test_web.py tests/test_web_runner.py tests/test_approved_vendor.py tests/test_claude_transport.py -q -rs
      - name: Web dependency install
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint, types, UI/locale regressions and both builds
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run build:public
      - name: Package self-contained public demo
        run: uv run --frozen --extra web python scripts/pack_public_demo.py
      - name: Signed loopback OIDC, API and actual fixed-fixture supervisor
        run: uv run --frozen --extra dev --extra web pytest tests/test_web_fullstack.py -q

