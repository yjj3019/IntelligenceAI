name: controller-ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  fixture-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed uv
        run: python -m pip install uv==0.11.11
      - name: Install locked repo-local dependencies
        run: uv sync --frozen --extra dev
      - name: Retrieve checksum-verified optional Linux scanner
        if: runner.os == 'Linux'
        run: |
          python scripts/fetch_gitleaks.py
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Scan exact tracked release blobs
        if: runner.os == 'Linux'
        run: uv run --frozen python scripts/scan_release.py
      - name: Format
        run: uv run --frozen ruff format --check src tests scripts
      - name: Fixture, contract, recovery and process tests
        run: uv run --frozen pytest -q --junitxml=test-results.xml
      - name: Build package
        run: uv build --no-sources --no-build-isolation

